<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mahalaxmi Enterprise CRM</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                ME
            </div>

            <div>
                <div class="brand-title">
                    MAHALAXMI
                </div>

                <div class="brand-subtitle">
                    ENTERPRISE CRM
                </div>
            </div>

        </div>


        <nav class="navigation">

            <button
                class="nav-item active"
                data-page="dashboard"
            >
                <span>📊</span>
                Dashboard
            </button>

            <button
                class="nav-item"
                data-page="customers"
            >
                <span>👥</span>
                Customers
            </button>

            <button
                class="nav-item"
                data-page="enquiries"
            >
                <span>📩</span>
                Enquiries
            </button>

            <button
                class="nav-item"
                data-page="products"
            >
                <span>📦</span>
                Products
            </button>

            <button
                class="nav-item"
                data-page="quotations"
            >
                <span>💰</span>
                Quotations
            </button>

            <button
                class="nav-item"
                data-page="orders"
            >
                <span>🧾</span>
                Orders
            </button>

            <button
                class="nav-item"
                data-page="followups"
            >
                <span>📅</span>
                Follow-ups
            </button>

            <button
                class="nav-item"
                data-page="payments"
            >
                <span>💳</span>
                Payments
            </button>

        </nav>


        <div class="sidebar-footer">

            <div class="connection-status">

                <span class="status-dot"></span>

                CRM Connected

            </div>

        </div>

    </aside>


    <!-- MAIN AREA -->

    <main class="main">

        <!-- TOP BAR -->

        <header class="topbar">

            <div>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

                <p id="pageSubtitle">
                    Welcome to Mahalaxmi Enterprise CRM
                </p>

            </div>


            <div class="topbar-right">

                <button class="icon-button">
                    🔔
                </button>

                <div class="user">

                    <div class="user-avatar">
                        H
                    </div>

                    <div class="user-info">

                        <strong>
                            Harshil
                        </strong>

                        <span>
                            Administrator
                        </span>

                    </div>

                </div>

            </div>

        </header>


        <!-- CONTENT -->

        <section
            id="content"
            class="content"
        >

            <!-- DASHBOARD WILL BE INSERTED HERE -->

        </section>

    </main>

</div>


<script src="app.js?v=4"></script>

</body>
</html>
